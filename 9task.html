<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Examination Result</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f6fb; margin: 0; padding: 20px; }
    .wrap { overflow-x: auto; }
    table { margin: auto; background: #fff; text-align: center; }
    caption { font-size: 22px; font-weight: bold; color: #1f3560; margin-bottom: 10px; }
    th { background: #b9d3f2; }
    .pass { background: #c8efc8; }
    .fail { background: #f6c3c3; }
    .avg { background: #d6e6f8; font-weight: bold; }
  </style>
</head>
<body>
  <div class="wrap">
    <table border="1" cellpadding="8" cellspacing="0" align="center">
      <caption>Student Examination Result</caption>
      <tr>
        <th rowspan="2">S. No.</th>
        <th rowspan="2">Student Name</th>
        <th rowspan="2">Roll Number</th>
        <th colspan="3">Subjects</th>
        <th rowspan="2">Total</th>
        <th rowspan="2">Result</th>
      </tr>
      <tr>
        <th>Science</th>
        <th>Maths</th>
        <th>English</th>
      </tr>
      <tr>
        <td>1</td><td align="left">Aarav Sharma</td><td>101</td>
        <td>85</td><td>90</td><td>78</td><td>253</td><td class="pass">Pass</td>
      </tr>
      <tr>
        <td>2</td><td align="left">Neha Gupta</td><td>102</td>
        <td>92</td><td>88</td><td>95</td><td>275</td><td class="pass">Pass</td>
      </tr>
      <tr>
        <td>3</td><td align="left">Rohan Mehta</td><td>103</td>
        <td>76</td><td>82</td><td>70</td><td>228</td><td class="pass">Pass</td>
      </tr>
      <tr>
        <td>4</td><td align="left">Sneha Verma</td><td>104</td>
        <td>68</td><td>74</td><td>72</td><td>214</td><td class="fail">Fail</td>
      </tr>
      <tr>
        <td>5</td><td align="left">Karan Singh</td><td>105</td>
        <td>88</td><td>93</td><td>85</td><td>266</td><td class="pass">Pass</td>
      </tr>
      <tr class="avg">
        <td colspan="3">Class Average</td>
        <td>81.8</td><td>85.4</td><td>80.0</td><td>247.2</td><td>-</td>
      </tr>
    </table>
  </div>
</body>
</html>
